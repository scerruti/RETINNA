[project]
name = "burn-scar-mapper"
version = "0.1.0"
description = "Map a California wildfire's burn scar from free Sentinel-2 imagery with a trained U-Net, and compare it to the official perimeter."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pystac-client>=0.8",
    "odc-stac>=0.3.10",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "mangum>=0.17"]
dev = ["pytest>=8.0", "httpx>=0.27", "boto3>=1.34", "mangum>=0.17", "moto[s3,cloudwatch,dynamodb]>=5.0"]

[project.scripts]
burnmap = "burnmap.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live STAC / ArcGIS services (deselect with -m 'not network')"]
